# 每天自动查一遍财报日期，并把网页发布到 GitHub Pages
name: 每日更新财报日历

on:
  schedule:
    - cron: "51 22 * * *"   # UTC 22:51 = 北京时间早上 6:51（GitHub 定时可能晚几分钟到一小时）
  workflow_dispatch:         # 允许在 Actions 页面手动点「Run workflow」
  push:
    branches: [main]
    paths-ignore: ["data.json"]  # 改了网页或脚本也重新发布

permissions:
  contents: write   # 把新的 data.json 存回仓库
  pages: write      # 发布网页
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 查询财报日期
        run: python fetch.py

      - name: 保存数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "更新财报数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
